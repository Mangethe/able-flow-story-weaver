name: Deterministic application tests
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Install isolated, pinned QA dependencies
        run: npm install --prefix "$RUNNER_TEMP/able-flow-qa" --no-audit --no-fund jsdom@29.1.1
      - name: Verify application, offline cache and sync
        run: node tests/verify.cjs E
        env:
          NODE_PATH: ${{ runner.temp }}/able-flow-qa/node_modules
