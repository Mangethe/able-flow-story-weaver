name: Codex Security Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save --package-lock=false @openai/codex-sdk@0.167.1 ajv@8.20.0
      - name: Verify the structured findings contract
        run: node --test tests/security-review.test.cjs
      - name: Run Codex security review
        run: node .github/scripts/security-review.cjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Gate on critical findings
        run: node .github/scripts/security-contract.cjs findings.json
